<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="color-scheme" content="dark">
<title>Minhas finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#0B0F14; --s1:#121821; --s2:#1A222D; --s3:#222C39;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --txt:#E9EEF5; --mute:#8794A6; --mute-2:#5F6B7B;
    --ouro:#D8B26E; --ouro-claro:#F0D9A8; --ouro-fundo:#B07F3A;
    --renda:#5ED3A8; --fixo:#7FB2FF; --variavel:#E58FB6; --neg:#FF7A7A;
    --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;
       font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  button,input,select{font-family:inherit}
  :focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

  .app{width:100%;max-width:480px;min-height:100vh;position:relative;padding:0 18px 120px;
       border-left:1px solid var(--line);border-right:1px solid var(--line)}
  @media(max-width:480px){.app{border:0}}

  /* cabeçalho */
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 6px}
  header h1{font-size:17px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .modo{font-size:11px;font-weight:500;color:var(--mute);border:1px solid var(--line-2);padding:3px 9px;border-radius:20px}
  .modo.nuvem{color:var(--ouro);border-color:rgba(216,178,110,.4)}
  .icon-btn{background:none;border:1px solid var(--line-2);color:var(--mute);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s}
  .icon-btn:hover{color:var(--txt);border-color:var(--mute)}
  .icon-btn svg{width:18px;height:18px}
  svg.i{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* mês */
  .mes{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0 4px}
  .mes button{border:0;background:none;color:var(--mute);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:10px}
  .mes button:hover{color:var(--txt);background:var(--s1)}
  .mes span{min-width:150px;text-align:center;font-size:15px;font-weight:600;text-transform:capitalize;letter-spacing:.01em}

  /* abas */
  .abas{display:flex;border-bottom:1px solid var(--line);margin:8px 0 22px}
  .abas button{flex:1;border:0;background:none;color:var(--mute);padding:12px 4px;font-size:14px;font-weight:500;cursor:pointer;position:relative;transition:color .2s}
  .abas button:hover{color:var(--txt)}
  .abas button.ativa{color:var(--txt);font-weight:600}
  .abas button.ativa::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;border-radius:2px;background:var(--ouro)}

  /* painel principal */
  .painel{background:linear-gradient(180deg,var(--s2) 0%,var(--s1) 70%);border:1px solid var(--line);border-radius:28px;padding:26px 18px 6px;position:relative;overflow:hidden}
  .painel::before{content:"";position:absolute;left:50%;top:-40px;width:320px;height:320px;transform:translateX(-50%);
       background:radial-gradient(circle,rgba(216,178,110,.14),transparent 65%);pointer-events:none}
  .anel{position:relative;width:216px;height:216px;margin:0 auto}
  .anel svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .anel .arco{filter:drop-shadow(0 0 8px rgba(216,178,110,.35))}
  .anel.neg .arco{filter:drop-shadow(0 0 8px rgba(255,122,122,.35))}
  .anel.anim .arco{animation:desenha 1.1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes desenha{from{stroke-dashoffset:var(--total)}}
  .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
  .centro small{color:var(--mute);font-size:13px;font-weight:500}
  .centro strong{font-size:34px;font-weight:300;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.1;white-space:nowrap}
  .centro strong .rs{font-size:15px;font-weight:500;color:var(--mute);margin-right:4px;letter-spacing:0}
  .centro span{font-size:12px;color:var(--ouro)}
  .anel.neg .centro strong{color:var(--neg)}
  .anel.neg .centro span{color:var(--neg)}

  .trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--line)}
  .trio div{padding:16px 6px 18px;text-align:center}
  .trio div+div{border-left:1px solid var(--line)}
  .trio small{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);font-weight:500}
  .trio small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  .trio b{display:block;margin-top:6px;font-size:14px;font-weight:600;white-space:nowrap}

  /* blocos */
  .bloco{margin-top:26px}
  .bloco-topo{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .bloco h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
  .legenda{display:flex;gap:12px;font-size:12px;color:var(--mute)}
  .legenda span{display:flex;align-items:center;gap:5px}
  .legenda span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

  .pagos .nums{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}
  .pagos .nums small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
  .pagos .nums div:last-child{text-align:right}
  .pagos b{font-size:16px;font-weight:600}
  .trilho{height:6px;background:var(--s3);border-radius:6px;overflow:hidden}
  .trilho div{height:100%;border-radius:6px;background:var(--renda);transition:width .5s}

  .destaque{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid rgba(216,178,110,.28);background:rgba(216,178,110,.06)}
  .destaque .ic{width:42px;height:42px;border-radius:12px;padding:10px;background:rgba(216,178,110,.14);color:var(--ouro);flex:none}
  .destaque small{display:block;font-size:12px;color:var(--mute)}
  .destaque b{font-size:15px;font-weight:600}
  .destaque .v{margin-left:auto;font-weight:600;color:var(--ouro-claro);white-space:nowrap}

  .cat-linha{margin-bottom:14px}
  .cat-linha .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
  .cat-linha .t span{color:var(--mute)}
  .cat-linha .t b{font-weight:600}
  .barra{height:4px;background:var(--s3);border-radius:4px;overflow:hidden}
  .barra div{height:100%;border-radius:4px;background:var(--c)}

  /* lista */
  .lista-topo{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
  .lista-topo small{color:var(--mute);font-size:13px;display:block;margin-bottom:4px}
  .lista-topo b{font-size:30px;font-weight:300;letter-spacing:-.02em}
  .lista-topo b .rs{font-size:14px;font-weight:500;color:var(--mute);margin-right:4px}
  .t-renda{--c:var(--renda)} .t-fixo{--c:var(--fixo)} .t-variavel{--c:var(--variavel)}
  .item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item .ic{width:42px;height:42px;border-radius:13px;padding:10px;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
  .item .info{flex:1;min-width:0}
  .item .info b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mute);margin-top:4px}
  .item .sub span,.item .sub .tag{white-space:nowrap}
  .item .sub .dt{color:var(--mute-2)}
  .item .val{font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
  .item .val.rec{color:var(--renda)}
  .tag{border:1px solid;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;cursor:pointer;background:none;transition:background .2s}
  .tag.pago{color:var(--renda);border-color:rgba(94,211,168,.4)}
  .tag.pago:hover{background:rgba(94,211,168,.1)}
  .tag.aberto{color:var(--ouro);border-color:rgba(216,178,110,.4)}
  .tag.aberto:hover{background:rgba(216,178,110,.1)}
  .del{border:0;background:none;color:var(--mute-2);width:32px;height:32px;padding:7px;border-radius:50%;cursor:pointer;flex:none}
  .del:hover{color:var(--neg);background:rgba(255,122,122,.1)}
  .vazio{padding:34px 10px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5}
  .vazio b{display:block;color:var(--txt);margin-bottom:4px;font-weight:600}
  .btn-sec{width:100%;margin-top:16px;border:1px solid var(--line-2);background:none;color:var(--txt);padding:13px;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;transition:background .2s}
  .btn-sec:hover{background:var(--s1)}

  /* botão + */
  .fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:max(18px,calc(50vw - 240px + 18px));
       width:58px;height:58px;border-radius:50%;border:0;color:#2A1D07;cursor:pointer;z-index:5;padding:17px;
       background:linear-gradient(145deg,var(--ouro-claro),var(--ouro) 55%,var(--ouro-fundo));
       box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.15) inset;transition:transform .15s}
  .fab:active{transform:scale(.94)}
  .fab svg{stroke-width:2.2}

  /* modais */
  .overlay{position:fixed;inset:0;background:rgba(3,6,10,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.on{display:flex}
  .overlay.on .modal{animation:sobe .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes sobe{from{transform:translateY(40px);opacity:0}}
  .modal{background:var(--s1);border:1px solid var(--line-2);border-bottom:0;width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .modal h3{font-size:18px;font-weight:600;margin-bottom:6px}
  label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:16px 0 6px}
  input,select{width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:13px;font-size:15px;background:var(--bg);color:var(--txt)}
  input::placeholder{color:var(--mute-2)}
  input:focus,select:focus{outline:none;border-color:var(--ouro)}
  .valor-in{font-size:26px;font-weight:300;padding:14px}
  .check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt);font-weight:500;margin-top:16px}
  .check input{width:18px;height:18px;accent-color:var(--ouro)}
  .acoes{display:flex;gap:10px;margin-top:22px}
  .acoes button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:700;font-size:15px;cursor:pointer}
  .b-cancel{background:var(--s3);color:var(--mute)}
  .b-ok{background:linear-gradient(145deg,var(--ouro-claro),var(--ouro));color:#2A1D07}
  .aviso{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.5}
  .aviso b{color:var(--txt)}

  #status{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--s3);border:1px solid var(--line-2);color:var(--txt);padding:9px 18px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}
  #status.on{opacity:1;transform:translateX(-50%)}

  @media (prefers-reduced-motion:reduce){
    .anel.anim .arco,.overlay.on .modal{animation:none}
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Minhas finanças <span class="modo" id="modo"></span></h1>
    <button class="icon-btn" id="btnConfig" title="Conectar planilha" aria-label="Conectar planilha"></button>
  </header>

  <div class="mes">
    <button id="prev" aria-label="Mês anterior"></button>
    <span id="mesLabel"></span>
    <button id="next" aria-label="Próximo mês"></button>
  </div>

  <nav class="abas" id="abas">
    <button data-v="resumo" class="ativa">Resumo</button>
    <button data-v="renda">Rendas</button>
    <button data-v="fixo">Fixos</button>
    <button data-v="variavel">Variáveis</button>
  </nav>

  <main id="view"></main>

  <button class="fab" id="fab" title="Novo lançamento" aria-label="Novo lançamento"></button>
</div>

<!-- novo lançamento -->
<div class="overlay" id="ovAdd">
  <form class="modal" id="formAdd">
    <h3>Novo lançamento</h3>
    <label for="fTipo">Tipo</label>
    <select id="fTipo">
      <option value="renda">Renda</option>
      <option value="fixo">Gasto fixo</option>
      <option value="variavel">Gasto variável</option>
    </select>
    <label for="fCat">Categoria</label><select id="fCat"></select>
    <label for="fValor">Valor (R$)</label>
    <input id="fValor" class="valor-in" type="number" step="0.01" min="0" inputmode="decimal" required placeholder="0,00">
    <label for="fDesc">Descrição (opcional)</label>
    <input id="fDesc" placeholder="Ex.: corte e barba">
    <label for="fData">Data</label><input id="fData" type="date" required>
    <label class="check" id="lblPago"><input type="checkbox" id="fPago"> Já está pago</label>
    <div class="acoes">
      <button type="button" class="b-cancel" data-close>Cancelar</button>
      <button type="submit" class="b-ok">Salvar</button>
    </div>
  </form>
</div>

<!-- conectar planilha -->
<div class="overlay" id="ovCfg">
  <form class="modal" id="formCfg">
    <h3>Conectar planilha</h3>
    <label for="cUrl">URL do app da Web (Apps Script)</label>
    <input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <p class="aviso">Sem URL, os dados ficam salvos só neste navegador (<b>modo local</b>). O passo a passo está no topo do arquivo Code.gs.</p>
    <div class="acoes">
      <button type="button" class="b-cancel" data-close>Fechar</button>
      <button type="submit" class="b-ok">Salvar</button>
    </div>
  </form>
</div>

<div id="status" role="status"></div>

<script>
/* ================= ÍCONES ================= */
const ICONS = {
  maleta:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  brilho:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/>',
  moeda:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8M12 16v1.5"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r=".8"/>',
  bomba:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3M7 8h4"/>',
  tesoura:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8l11 11M8.5 16L20 5"/>',
  cartao:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
  casa:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',
  raio:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  gota:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  celular:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  repetir:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
  pino:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  talher:'<path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8a2 2 0 0 1-2 2M18 21V3c-2 1-3 4-3 8h3"/>',
  saude:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  sacola:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
  estrela:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  onibus:'<rect x="4" y="3.5" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-3.5M16 21v-3.5"/><circle cx="8" cy="14.2" r=".7"/><circle cx="16" cy="14.2" r=".7"/>',
  recibo:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/>',
  engrenagem:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  esq:'<path d="M15 5l-7 7 7 7"/>',
  dir:'<path d="M9 5l7 7-7 7"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  lixo:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  grafico:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const ico = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.recibo}</svg>`;

/* ================= CONFIG ================= */
const CATS = {
  renda:    [['Salário','maleta'],['Renda extra','brilho'],['Outros','moeda']],
  fixo:     [['Internet','wifi'],['Gasolina','bomba'],['Barbeiro','tesoura'],['Cartão de crédito','cartao'],['Aluguel/Condomínio','casa'],['Luz','raio'],['Água','gota'],['Celular','celular'],['Assinaturas','repetir'],['Outros','pino']],
  variavel: [['Alimentação','talher'],['Remédios','saude'],['Compras','sacola'],['Lazer','estrela'],['Transporte','onibus'],['Outros','recibo']]
};
const TIPO_NOME = {renda:'Rendas', fixo:'Gastos fixos', variavel:'Gastos variáveis'};
const VAZIO = {
  renda:['Nenhuma renda neste mês','Toque em + para lançar seu salário ou outra renda.'],
  fixo:['Nenhum gasto fixo neste mês','Toque em + para lançar, ou copie os fixos do mês anterior.'],
  variavel:['Nenhum gasto variável neste mês','Toque em + para lançar alimentação, remédios ou compras.']
};
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let API = localStorage.getItem('fin_api') || '';
let itens = [];
let ym = new Date().toISOString().slice(0,7);
let aba = 'resumo';
let primeiraVez = true;

const $ = s => document.querySelector(s);
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iconeDe = (tipo,cat) => ico((CATS[tipo].find(c=>c[0]===cat)||[0,'recibo'])[1]);
const dataCurta = d => d.slice(8,10)+' '+MES_CURTO[Number(d.slice(5,7))-1];

function aviso(t,ms=1800){const s=$('#status');s.textContent=t;s.classList.add('on');clearTimeout(aviso.t);aviso.t=setTimeout(()=>s.classList.remove('on'),ms)}

/* ================= DADOS ================= */
async function carregar(){
  const m=$('#modo'); m.textContent = API ? 'planilha' : 'modo local'; m.classList.toggle('nuvem',!!API);
  if(!API){
    try{ itens = JSON.parse(localStorage.getItem('fin_itens')||'[]'); }catch(e){ itens=[]; }
    return render();
  }
  aviso('Carregando da planilha…',4000);
  try{
    const r = await fetch(API); const j = await r.json();
    if(!j.ok) throw new Error(j.erro);
    itens = j.itens.map(i=>({...i, valor:Number(i.valor), pago:i.pago===true||i.pago==='TRUE'||i.pago==='true'}));
    aviso('Dados carregados');
  }catch(e){ aviso('Não foi possível carregar: '+e.message,3500); }
  render();
}
function salvarLocal(){ if(!API) localStorage.setItem('fin_itens',JSON.stringify(itens)); }
async function enviar(payload){
  if(!API) return salvarLocal();
  try{
    const r = await fetch(API,{method:'POST',body:JSON.stringify(payload)}); // text/plain evita preflight CORS
    const j = await r.json(); if(!j.ok) throw new Error(j.erro);
  }catch(e){ aviso('Falha ao sincronizar: '+e.message,3500); }
}

async function adicionar(it){ itens.push(it); render(); await enviar({action:'add',item:it}); salvarLocal(); }
async function remover(id){
  if(!confirm('Excluir este lançamento?')) return;
  itens = itens.filter(i=>i.id!==id); render(); await enviar({action:'delete',id}); salvarLocal();
}
async function alternarPago(id){
  const it = itens.find(i=>i.id===id); it.pago=!it.pago; render();
  await enviar({action:'update',id,campos:{pago:it.pago}}); salvarLocal();
}
async function copiarFixosMesAnterior(){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y,m-2,1); const prev = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const base = itens.filter(i=>i.tipo==='fixo' && i.mes===prev);
  if(!base.length) return aviso('Não há gastos fixos no mês anterior');
  const novos = base.map(i=>({...i,id:uid(),mes:ym,data:ym+'-'+i.data.slice(8,10),pago:false}));
  itens.push(...novos); render();
  await enviar({action:'bulkAdd',itens:novos}); salvarLocal();
  aviso(novos.length+' gastos fixos copiados');
}

/* ================= RENDER ================= */
const doMes = tipo => itens.filter(i=>i.mes===ym && (!tipo||i.tipo===tipo)).sort((a,b)=>a.data<b.data?1:-1);
const soma = arr => arr.reduce((s,i)=>s+Number(i.valor),0);

function render(){
  const [y,m]=ym.split('-').map(Number);
  $('#mesLabel').textContent = MESES[m-1]+' '+y;
  document.querySelectorAll('#abas button').forEach(b=>b.classList.toggle('ativa',b.dataset.v===aba));
  $('#view').innerHTML = aba==='resumo' ? viewResumo() : viewLista(aba);
  primeiraVez = false;
}

function viewResumo(){
  const rend=soma(doMes('renda')), fix=soma(doMes('fixo')), vari=soma(doMes('variavel'));
  const gasto=fix+vari, saldo=rend-gasto;
  const pct = rend>0 ? Math.min(gasto/rend,1) : (gasto>0?1:0);
  const R=88, C=2*Math.PI*R;
  const pago=soma(doMes('fixo').filter(i=>i.pago)), pend=fix-pago;
  const pctPago = fix>0 ? (pago/fix)*100 : 0;

  const mapa={};
  doMes().filter(i=>i.tipo!=='renda').forEach(i=>{const k=i.tipo+'|'+i.categoria;mapa[k]=(mapa[k]||0)+Number(i.valor)});
  const cats=Object.entries(mapa).map(([k,v])=>{const [t,c]=k.split('|');return {t,c,v}}).sort((a,b)=>b.v-a.v);
  const maior=cats[0];
  const resto = rend>0 ? `${Math.round(pct*100)}% da renda gasta` : (gasto>0?'Sem renda lançada':'Nenhum lançamento ainda');

  return `
  <section class="painel">
    <div class="anel ${saldo<0?'neg':''} ${primeiraVez?'anim':''}" style="--total:${C}">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${saldo<0?'#FFB3B3':'#F0D9A8'}"/><stop offset="1" stop-color="${saldo<0?'#FF7A7A':'#B07F3A'}"/></linearGradient></defs>
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="9"/>
        <circle class="arco" cx="100" cy="100" r="${R}" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/>
      </svg>
      <div class="centro"><small>Saldo do mês</small><strong><span class="rs">R$</span>${num(saldo)}</strong><span>${resto}</span></div>
    </div>
    <div class="trio">
      <div style="--c:var(--renda)"><small>Rendas</small><b>${brl(rend)}</b></div>
      <div style="--c:var(--fixo)"><small>Fixos</small><b>${brl(fix)}</b></div>
      <div style="--c:var(--variavel)"><small>Variáveis</small><b>${brl(vari)}</b></div>
    </div>
  </section>

  <section class="bloco pagos">
    <div class="bloco-topo"><h2>Contas fixas</h2></div>
    <div class="nums">
      <div><small>Pago</small><b>${brl(pago)}</b></div>
      <div><small>Falta pagar</small><b>${brl(pend)}</b></div>
    </div>
    <div class="trilho"><div style="width:${pctPago}%"></div></div>
  </section>

  <section class="bloco">
    <div class="destaque">
      <div class="ic">${maior?iconeDe(maior.t,maior.c):ico('grafico')}</div>
      <div><small>Maior gasto do mês</small><b>${maior?esc(maior.c):'Nenhum gasto ainda'}</b></div>
      ${maior?`<div class="v">${brl(maior.v)}</div>`:''}
    </div>
  </section>

  <section class="bloco">
    <div class="bloco-topo"><h2>Para onde foi o dinheiro</h2>
      <div class="legenda"><span style="--c:var(--fixo)">Fixos</span><span style="--c:var(--variavel)">Variáveis</span></div></div>
    ${cats.length? cats.map(x=>`
      <div class="cat-linha" style="--c:var(--${x.t})"><div class="t"><span>${esc(x.c)}</span><b>${brl(x.v)}</b></div>
      <div class="barra"><div style="width:${(x.v/cats[0].v)*100}%"></div></div></div>`).join('')
      : `<div class="vazio"><b>Nada gasto neste mês</b>Toque em + para lançar o primeiro gasto.</div>`}
  </section>`;
}

function viewLista(tipo){
  const lista=doMes(tipo), tot=soma(lista);
  return `
  <section class="t-${tipo}">
    <div class="lista-topo"><div><small>${TIPO_NOME[tipo]} no mês</small><b style="${tipo==='renda'?'color:var(--renda)':''}"><span class="rs">R$</span>${num(tot)}</b></div></div>
    ${lista.length? lista.map(i=>`
      <div class="item t-${tipo}">
        <div class="ic">${iconeDe(tipo,i.categoria)}</div>
        <div class="info"><b>${esc(i.descricao||i.categoria)}</b>
          <div class="sub">${i.descricao&&i.descricao!==i.categoria?`<span>${esc(i.categoria)}</span>`:''}<span class="dt">${dataCurta(i.data)}</span>
          ${tipo==='fixo'?`<button class="tag ${i.pago?'pago':'aberto'}" onclick="alternarPago('${i.id}')">${i.pago?'Pago':'Em aberto'}</button>`:''}</div>
        </div>
        <div class="val ${tipo==='renda'?'rec':''}">${tipo==='renda'?'+':'−'} ${brl(i.valor)}</div>
        <button class="del" onclick="remover('${i.id}')" aria-label="Excluir">${ico('lixo')}</button>
      </div>`).join('') : `<div class="vazio"><b>${VAZIO[tipo][0]}</b>${VAZIO[tipo][1]}</div>`}
    ${tipo==='fixo'?'<button class="btn-sec" onclick="copiarFixosMesAnterior()">Copiar fixos do mês anterior</button>':''}
  </section>`;
}

/* ================= EVENTOS ================= */
$('#btnConfig').innerHTML = ico('engrenagem');
$('#prev').innerHTML = ico('esq');
$('#next').innerHTML = ico('dir');
$('#fab').innerHTML = ico('mais');

function mudaMes(d){const [y,m]=ym.split('-').map(Number);const n=new Date(y,m-1+d,1);ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render()}
$('#prev').onclick=()=>mudaMes(-1); $('#next').onclick=()=>mudaMes(1);
$('#abas').onclick=e=>{const b=e.target.closest('button');if(b){aba=b.dataset.v;render()}};

function preencheCats(){
  const t=$('#fTipo').value;
  $('#fCat').innerHTML=CATS[t].map(c=>`<option>${c[0]}</option>`).join('');
  $('#lblPago').style.display = t==='fixo'?'flex':'none';
}
$('#fTipo').onchange=preencheCats;

$('#fab').onclick=()=>{
  $('#fTipo').value = aba==='resumo' ? 'variavel' : aba;
  preencheCats();
  $('#fDesc').value=''; $('#fValor').value=''; $('#fPago').checked=false;
  const hoje=new Date(); const dflt = ym===hoje.toISOString().slice(0,7) ? hoje.toISOString().slice(0,10) : ym+'-01';
  $('#fData').value=dflt;
  $('#ovAdd').classList.add('on'); setTimeout(()=>$('#fValor').focus(),100);
};
$('#formAdd').onsubmit=e=>{
  e.preventDefault();
  const data=$('#fData').value, tipo=$('#fTipo').value;
  adicionar({id:uid(),tipo,categoria:$('#fCat').value,descricao:$('#fDesc').value.trim(),
    valor:parseFloat($('#fValor').value),data,mes:data.slice(0,7),pago:tipo==='fixo'?$('#fPago').checked:false});
  ym=data.slice(0,7);
  $('#ovAdd').classList.remove('on');
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('on'));
document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.on').forEach(o=>o.classList.remove('on'))});

$('#btnConfig').onclick=()=>{$('#cUrl').value=API;$('#ovCfg').classList.add('on')};
$('#formCfg').onsubmit=e=>{
  e.preventDefault(); API=$('#cUrl').value.trim();
  localStorage.setItem('fin_api',API); $('#ovCfg').classList.remove('on'); primeiraVez=true; carregar();
};

carregar();
</script>
</body>
</html>
